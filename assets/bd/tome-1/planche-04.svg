  <rect width="1000" height="1414" fill="#ffffff"/>

  <!-- Case 1 : deux atomes, des forces inégales -->
  <rect x="60" y="60" width="880" height="440" fill="none" stroke="#111" stroke-width="2"/>
  <text x="92" y="120" font-size="19" fill="#111">Entre les atomes, les forces se déséquilibrent.</text>
  <circle cx="360" cy="300" r="15" fill="#111"/>
  <circle cx="660" cy="300" r="15" fill="#111"/>
  <line x1="385" y1="262" x2="565" y2="262" stroke="#111" stroke-width="3"/>
  <path d="M582 262 L558 251 L558 273 Z" fill="#111"/>
  <line x1="635" y1="338" x2="575" y2="338" stroke="#111" stroke-width="3"/>
  <path d="M558 338 L582 327 L582 349 Z" fill="#111"/>

  <!-- Case 2 : le mouvement -->
  <rect x="60" y="524" width="880" height="440" fill="none" stroke="#111" stroke-width="2"/>
  <text x="92" y="584" font-size="19" fill="#111">Le déséquilibre induit le mouvement.</text>
  <use href="#p04-cellg" transform="translate(330,760) scale(1.4)"/>
  <use href="#p04-cell" transform="translate(640,760) scale(1.4)"/>
  <path d="M340 672 Q 490 616 616 664" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
