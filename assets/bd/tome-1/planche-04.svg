  <!-- Définition -->
  <rect x="120" y="1030" width="760" height="130" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="152" y="1082" font-size="19" fill="#111"><tspan font-weight="700">Énergie</tspan> — Déséquilibre des forces d'interaction entre les atomes.</text>
  <text x="152" y="1109" font-size="19" fill="#111">Induit le mouvement.</text>

  <text x="500" y="1392" text-anchor="middle" font-size="15" fill="#111">— 4 —</text>
