  <rect width="1000" height="1414" fill="#ffffff"/>

  <!-- Case 1 : l'organisme complet -->
  <rect x="60" y="60" width="880" height="580" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="180" y="110" width="640" height="92" rx="18" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="500" y="147" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#111">JE SUIS UN ORGANISME. UN FLUX ME CARACTÉRISE :</text>
  <text x="500" y="176" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#111">DONNÉE, INFORMATION, DÉCISION, ACTION.</text>
  <circle cx="500" cy="226" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="500" cy="250" r="3.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="500" cy="272" r="2" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="500" cy="430" r="110" fill="none" stroke="#111" stroke-width="2.5"/>
  <use href="#p14-cell" transform="translate(500,430) scale(1.2)"/>

  <!-- Case 2 : un plus grand que moi -->
  <rect x="60" y="684" width="880" height="580" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M560 686 A 700 700 0 0 1 938 1120" fill="none" stroke="#111" stroke-width="2.5"/>
  <circle cx="280" cy="900" r="22" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="560" cy="880" r="20" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="620" cy="1030" r="24" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="330" cy="1080" r="18" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="700" cy="950" r="16" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="430" cy="980" r="32" fill="none" stroke="#111" stroke-width="2.5"/>
  <use href="#p14-cell" transform="translate(430,980) scale(0.4)"/>

  <rect x="110" y="730" width="420" height="92" rx="18" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="767" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#111">…ET SI J'ÉTAIS MOI-MÊME</text>
  <text x="320" y="796" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#111">DANS UN PLUS GRAND QUE MOI ?</text>
  <circle cx="350" cy="845" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="380" cy="890" r="3.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="405" cy="930" r="2" fill="#fff" stroke="#111" stroke-width="2"/>

  <text x="500" y="1330" text-anchor="middle" font-size="20" fill="#111">À suivre — Tome 2 : L'emboîtement.</text>

  <text x="500" y="1392" text-anchor="middle" font-size="15" fill="#111">— 14 —</text>
