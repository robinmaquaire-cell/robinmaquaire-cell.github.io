<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="1414" fill="#ffffff"/>

  <!-- Case 1 : DIA -->
  <rect x="60" y="60" width="880" height="330" fill="none" stroke="#111" stroke-width="2"/>
  <text x="92" y="112" font-size="15" font-weight="600" letter-spacing="2" fill="#111">UN SYSTÈME SUIT DIA</text>
  <rect x="105" y="170" width="200" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="205" y="218" text-anchor="middle" font-size="22" font-weight="600" fill="#111">Donnée</text>
  <rect x="400" y="170" width="200" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="500" y="218" text-anchor="middle" font-size="22" font-weight="600" fill="#111">Information</text>
  <rect x="695" y="170" width="200" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="795" y="218" text-anchor="middle" font-size="22" font-weight="600" fill="#111">Action</text>
  <line x1="315" y1="210" x2="382" y2="210" stroke="#111" stroke-width="2.5"/>
  <path d="M394 210 L374 201 L374 219 Z" fill="#111"/>
  <line x1="610" y1="210" x2="677" y2="210" stroke="#111" stroke-width="2.5"/>
  <path d="M689 210 L669 201 L669 219 Z" fill="#111"/>

  <!-- Case 2 : DIDA -->
  <rect x="60" y="444" width="880" height="380" fill="none" stroke="#111" stroke-width="2"/>
  <text x="92" y="496" font-size="15" font-weight="600" letter-spacing="2" fill="#111">UN ORGANISME SUIT DIDA</text>
  <rect x="82" y="560" width="175" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="169" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Donnée</text>
  <rect x="302" y="560" width="175" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="389" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Information</text>
  <rect x="522" y="560" width="175" height="80" fill="#fff" stroke="#111" stroke-width="3.5"/>
  <rect x="530" y="568" width="159" height="64" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="609" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Décision</text>
  <rect x="742" y="560" width="175" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="829" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Action</text>
  <line x1="264" y1="600" x2="286" y2="600" stroke="#111" stroke-width="2.5"/>
  <path d="M297 600 L277 591 L277 609 Z" fill="#111"/>
  <line x1="484" y1="600" x2="506" y2="600" stroke="#111" stroke-width="2.5"/>
  <path d="M517 600 L497 591 L497 609 Z" fill="#111"/>
  <line x1="704" y1="600" x2="726" y2="600" stroke="#111" stroke-width="2.5"/>
  <path d="M737 600 L717 591 L717 609 Z" fill="#111"/>

  <rect x="295" y="700" width="410" height="92" rx="18" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="500" y="737" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#111">TOUTE LA DIFFÉRENCE TIENT</text>
  <text x="500" y="766" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="0.5" fill="#111">DANS CE D SUPPLÉMENTAIRE.</text>
  <circle cx="600" cy="684" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="607" cy="664" r="3.5" fill="#fff" stroke="#111" stroke-width="2"/>

  <text x="500" y="890" text-anchor="middle" font-size="19" fill="#111">La décision est ce qui distingue un organisme d'un simple système.</text>

  <!-- Définitions -->
  <rect x="84" y="940" width="380" height="150" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="112" y="992" font-size="17" fill="#111"><tspan font-weight="700">DIA</tspan> — Flux caractéristique</text>
  <text x="112" y="1016" font-size="17" fill="#111">d'un système. Représente :</text>
  <text x="112" y="1040" font-size="17" fill="#111">Donnée → Information → Action.</text>

  <rect x="536" y="940" width="380" height="150" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="564" y="980" font-size="17" fill="#111"><tspan font-weight="700">DIDA</tspan> — Flux caractéristique</text>
  <text x="564" y="1004" font-size="17" fill="#111">d'un organisme. Représente :</text>
  <text x="564" y="1028" font-size="17" fill="#111">Donnée → Information →</text>
  <text x="564" y="1052" font-size="17" fill="#111">Décision → Action.</text>

  <text x="500" y="1392" text-anchor="middle" font-size="15" fill="#111">— 12 —</text>
</svg>
