  <rect width="1000" height="1414" fill="#ffffff"/>

  <!-- Case 1 : le motif souligné -->
  <rect x="60" y="60" width="428" height="480" fill="none" stroke="#111" stroke-width="2"/>
  <text x="92" y="120" font-size="19" fill="#111">La donnée est une modification ;</text>
  <text x="92" y="147" font-size="19" fill="#111">l'information est un motif.</text>
  <circle cx="274" cy="300" r="100" fill="none" stroke="#111" stroke-width="2.5"/>
