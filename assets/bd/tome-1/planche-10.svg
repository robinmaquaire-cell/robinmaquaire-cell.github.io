  <rect x="570" y="316" width="300" height="56" rx="18" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="720" y="352" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="0.5" fill="#111">JE SUIS FAIT DE MOTIFS.</text>
  <circle cx="556" cy="382" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="540" cy="398" r="3.5" fill="#fff" stroke="#111" stroke-width="2"/>

