  <text x="152" y="655" font-size="19" fill="#111"><tspan font-weight="700">Information</tspan> — Motif des structures physiques.</text>

  <!-- Case 3 : silence -->
  <rect x="60" y="760" width="880" height="500" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="500" cy="1010" r="55" fill="none" stroke="#111" stroke-width="2"/>
