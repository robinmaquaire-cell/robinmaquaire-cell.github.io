  <text x="274" y="458" text-anchor="middle" font-size="16" fill="#111">le motif de mes structures</text>

  <!-- Case 2 : les deux motifs -->
  <rect x="512" y="60" width="428" height="480" fill="none" stroke="#111" stroke-width="2"/>
  <use href="#p10-cell" transform="translate(726,175)"/>
  <text x="726" y="248" text-anchor="middle" font-size="16" fill="#111">information : le motif de la forme</text>
  <line x1="526" y1="278" x2="926" y2="278" stroke="#111" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M620 448 Q 670 411 714 439" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/>
