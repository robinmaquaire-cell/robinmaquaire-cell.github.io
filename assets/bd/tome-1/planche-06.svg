      <line x1="-44" y1="-10" x2="0" y2="10" stroke="#111" stroke-width="2"/>
      <line x1="0" y1="10" x2="44" y2="-10" stroke="#111" stroke-width="2"/>
      <line x1="44" y1="-10" x2="88" y2="10" stroke="#111" stroke-width="2"/>
      <circle cx="-88" cy="10" r="6" fill="#111"/>
      <circle cx="-44" cy="-10" r="6" fill="#111"/>
      <circle cx="0" cy="10" r="6" fill="#111"/>
      <circle cx="44" cy="-10" r="6" fill="#111"/>
      <circle cx="88" cy="10" r="6" fill="#111"/>
    </g>
